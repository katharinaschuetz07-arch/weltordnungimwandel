<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weltordnung im Wandel 2.4.1</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#000;
    font-family:Arial, sans-serif;
    color:#fff;
    max-width:500px;
    margin:auto;
}

header{
    text-align:center;
    padding:18px 10px 10px 10px;
    font-family:'Oswald', sans-serif;
    font-size:26px;
    font-weight:600;
    color:#ffd700;
}

.nav-top{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:15px;
}

.button{
    background:#000;
    color:#ffd700;
    border:2px solid #ffd700;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    font-size:14px;
}

.card{
    background:#111;
    border-radius:15px;
    padding:25px 20px 40px 20px;
    margin:10px;
    min-height:220px;
    position:relative;
    cursor:pointer;
    font-size:16px;
    line-height:1.4;
}

.card-title{
    font-size:18px;
    font-weight:bold;
    color:#ffd700;
    margin-bottom:10px;
}

.card-hint{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    font-size:12px;
    color:#aaa;
}

.nav-bottom{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:15px 0;
}

.nav-bottom button{
    background:#000;
    color:#ffd700;
    border:2px solid #ffd700;
    padding:8px 16px;
    border-radius:20px;
    cursor:pointer;
}

.extra-buttons{
    display:flex;
    gap:10px;
    margin:15px 10px;
}

.extra-buttons .button{
    flex:1;
    text-align:center;
}

.video{
    text-align:center;
    margin-top:10px;
}

.video a{
    color:#ffd700;
    text-decoration:none;
    font-size:14px;
}

footer{
    text-align:center;
    font-size:12px;
    color:#666;
    margin:15px 0 10px 0;
}
</style>
</head>

<body>

<header>Weltordnung im Wandel</header>

<div class="nav-top">
<button class="button" onclick="setCategory('Zyklus')">ZYKLUS</button>
<button class="button" onclick="setCategory('Faktoren')">FAKTOREN</button>
<button class="button" onclick="setCategory('Geld')">GELD</button>
<button class="button" onclick="setCategory('Konflikt')">KONFLIKT</button>
<button class="button" onclick="setCategory('USA')">USA</button>
<button class="button" onclick="setCategory('China')">CHINA</button>
<button class="button" onclick="setCategory('Europa')">EUROPA</button>
<button class="button" onclick="setCategory('Strategie')">STRATEGIE</button>
</div>

<div class="card" onclick="nextCard()">
<div class="card-title" id="cardTitle"></div>
<div id="cardContent"></div>
<div class="card-hint">Tippe für nächste Karte</div>
</div>

<div class="nav-bottom">
<button onclick="prevCard()">Zurück</button>
<button onclick="speakCard()">Vorlesen</button>
<button onclick="nextCard()">Weiter</button>
</div>

<div class="extra-buttons">
<button class="button" onclick="setCategory('Start')">START</button>
<button class="button" onclick="setCategory('Redalio')">RAY DALIO</button>
</div>

<div class="video">
<a href="https://www.youtube.com/watch?v=xguam0TKMw8" target="_blank">
Videoanalyse starten
</a>
</div>

<footer>Version 2.4.1</footer>

let speech=window.speechSynthesis;

{title:"Technologiekrieg",content:"KI und Chips."},

],

],

};

function showCard(){
let card=data[category][index];
document.getElementById("cardTitle").innerText=card.title;
document.getElementById("cardContent").innerText=card.content;
}

function nextCard(){
index++;
if(index>=data[category].length){index=0;}
showCard();
speakCard();
}

function prevCard(){
index--;
if(index<0){index=data[category].length-1;}
showCard();
speakCard();
}

function speakCard(){
speech.cancel();
let text=data[category][index].title+". "+data[category][index].content;
let utter=new SpeechSynthesisUtterance(text);
utter.lang="de-DE";
speech.speak(utter);
}

function setCategory(cat){
category=cat;
index=0;
showCard();
speakCard();
}

window.onload=function(){
showCard();
speakCard();
};
</script>

</body>
</html>
