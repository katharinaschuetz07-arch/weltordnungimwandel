<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Weltordnung im Wandel v2.1.2</title>
<style>
:root {
    --bg: #0a0f1a;
    --card-bg: #141c2d;
    --accent: #d4af37;
    --accent-soft: rgba(212, 175, 55, 0.15);
    --text-bright: #f5f5f0;
    --text-dim: #a0a8b8;
    --font-serif: 'Times New Roman', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --radius: 20px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    font-family: var(--font-sans);
    background-color: var(--bg);
    color: var(--text-bright);
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
}

/* HEADER */
.header-fixed {
    position: sticky;
    top: 0; width: 100%;
    text-align: center;
    padding: 20px 0 15px 0;
    background: rgba(10, 15, 26, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--accent-soft);
    z-index: 5000;
}
.main-title { font-family: var(--font-serif); font-size: clamp(18px, 4vw, 24px); letter-spacing: 2px; color: var(--accent); margin: 0; text-transform: uppercase; }
.version-tag { font-size: 10px; color: var(--text-dim); opacity: 0.6; margin-top: 4px; letter-spacing: 2px; }

/* CONTENT WRAPPER */
.content-wrapper {
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-grow: 1;
    width: 100%;
    max-width: 400px; /* 7,9 Zoll optimiert */
    margin: 0 auto;
}

/* BUTTON GRID 8 OBEREN BUTTONS */
.button-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4 pro Reihe */
    grid-template-rows: repeat(2, auto); /* 2 Reihen */
    gap: 12px;
    width: 100%;
    margin-bottom: 20px;
}
.menu-btn {
    background: var(--card-bg);
    border: 1px solid var(--accent-soft);
    color: var(--accent);
    padding: 14px 10px;
    border-radius: 25px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, background 0.2s;
}
.menu-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.menu-btn:active { background: var(--accent-soft); }

/* LERNKARTE */
#card-overlay {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    margin-bottom: 20px;
}
.info-card {
    background: var(--card-bg);
    padding: 20px;
    width: 100%;
    min-height: 300px;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    position: relative;
    box-shadow: 0 15px 40px rgba(0,0,0,0.7);
}
.card-counter { position: absolute; top: 10px; right: 15px; font-size: 12px; color: var(--accent); opacity: 0.7; }

/* NAV BUTTONS UNTER DER KARTE */
.nav-controls { 
    display: flex;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    margin-top: 15px;
}
.nav-btn {
    flex: 1;
    padding: 14px 0;
    background: var(--card-bg);
    border: 1px solid var(--accent-soft);
    color: var(--text-bright);
    border-radius: 25px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s, transform 0.2s;
}
.nav-btn:hover { transform: translateY(-1px); }
.btn-read { border-color: var(--accent); color: var(--accent); }

/* VIDEO BUTTON UNTER NAV */
.yt-button {
    display: block;
    width: 100%;
    margin-top: 15px;
    padding: 14px 0;
    background: #cc0000;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    text-align: center;
    transition: opacity 0.2s;
}
.yt-button:hover { opacity: 0.9; }

footer { 
    padding: 25px 15px; 
    text-align: center; 
    font-size: 10px; 
    color: var(--text-dim); 
    line-height: 1.6;
    opacity: 0.7;
}
.footer-brand { color: var(--accent); font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 6px; }

</style>
</head>
<body>

<div class="header-fixed">
    <p class="main-title">Weltordnung im Wandel</p>
    <p class="version-tag">LEITFADEN ZUR ANALYSE GLOBALER ZYKLEN</p>
    <p class="version-tag">VERSION 2.1.2</p>
</div>

<div class="content-wrapper">
    <!-- 8 Buttons 2x4 -->
    <div class="button-grid">
        <button class="menu-btn" onclick="openTopic(0)">Zyklus</button>
        <button class="menu-btn" onclick="openTopic(1)">Faktoren</button>
        <button class="menu-btn" onclick="openTopic(2)">Geld</button>
        <button class="menu-btn" onclick="openTopic(3)">Konflikt</button>
        <button class="menu-btn" onclick="openTopic(4)">USA</button>
        <button class="menu-btn" onclick="openTopic(5)">China</button>
        <button class="menu-btn" onclick="openTopic(6)">Europa</button>
        <button class="menu-btn" onclick="openTopic(7)">Strategie</button>
    </div>

    <!-- Lernkarte + Nav -->
    <div id="card-overlay">
        <div class="info-card" onclick="cardAction()">
            <div id="card-counter" class="card-counter"></div>
            <h3 id="overlay-title" style="font-family: var(--font-serif); color: var(--accent); margin: 0 0 10px 0; font-size: clamp(16px, 3vw, 22px); border-bottom: 1px solid var(--accent-soft); padding-bottom: 10px;"></h3>
            <p id="overlay-content" style="line-height: 1.6; font-size: clamp(14px, 2vw, 18px); margin: 0;"></p>
            <p style="font-size: 10px; color: var(--accent); margin-top: 20px; text-align: center; opacity: 0.5; letter-spacing: 1px;">• TIPPEN ZUM VORLESEN & WEITER •</p>
        </div>
        <div class="nav-controls">
            <button class="nav-btn" onclick="prevCard()">Zurück</button>
            <button class="nav-btn btn-read" onclick="cardAction()">Vorlesen</button>
            <button class="nav-btn" onclick="nextCardAndRead()">Weiter</button>
        </div>
        <a href="https://www.youtube.com/results?search_query=ray+dalio+weltordnung+deutsch" target="_blank" class="yt-button">🎬 VIDEO ANALYSE STARTEN</a>
    </div>
</div>

<footer>
    <span class="footer-brand">Ray Dalio Masterclass</span>
    &copy; 2025 Lern-Anwendung zu „Weltordnung im Wandel“.<br>
    Inhalte stellen didaktische Zusammenfassungen dar.
</footer>

<script>
const dataSets = [
    ["Der 'Große Zyklus' bestimmt seit 500 Jahren den Aufstieg und Fall von Imperien.","Phase 1: Eine neue Ordnung entsteht meist nach einem großen Konflikt.","Bildung und Innovation sind die Motoren des frühen Wachstums.","Die Reservewährung markiert den Zenit der Weltmacht.","Hohe Schulden und Gelddrucken führen zum schleichenden Verfall.","Interne Polarisierung schwächt das gesellschaftliche Fundament."],
    ["Faktor 1: Bildungsqualität.","Faktor 2: Innovation & Patente.","Faktor 3: Wettbewerbsfähigkeit.","Faktor 4: Militärstärke.","Faktor 5: Welthandelsanteil.","Faktor 6: Wirtschaftsleistung."],
    ["Geld ist ein Speicher für Kaufkraft – verliert es diesen, bricht das System.","Papierwährungen ohne Deckung haben eine begrenzte Lebensdauer.","Verschuldungszyklen enden oft in massiver Geldentwertung.","Gold bleibt der einzige Anker über Jahrhunderte.","Zentralbanken nutzen Inflation oft als 'versteckte Steuer'.","Währungsreformen markieren den Beginn eines neuen Finanzzyklus."],
    ["Wachsende Einkommenskluft treibt den Populismus an.","Wenn Debatten aggressiv werden, ist der Frieden in Gefahr.","Kapitalflucht ist ein klassisches Warnsignal für den Kollaps.","Soziale Unruhen folgen oft auf schwindende Kaufkraft.","Nationaler Zusammenhalt ist in Krisen wichtiger als Effizienz.","Krisen führen oft zu einem Ruf nach autoritären Führern."],
    ["Die USA befinden sich in der späten phase ihres Zyklus.","Die massive Staatsverschuldung schränkt den Spielraum ein.","Politische Spaltung gefährdet die Handlungsfähigkeit.","Der Dollar wird zunehmend als geopolitische Waffe eingesetzt.","Veraltete Infrastruktur in den USA ist ein Warnsignal.","Die Resilienz Amerikas wird nun geprüft."],
    ["Chinas Ziel: Weltmacht bis zum Jahr 2049.","Vorsprung in KI und grüner Energie.","Risiko: Die Überalterung der Bevölkerung.","Die 'Seidenstraße' sichert globale Rohstoffe.","Staatskapitalismus erlaubt schnelle Investitionen.","Taiwan ist der gefährlichste Brennpunkt."],
    ["Europa steht zwischen den Fronten der USA und China.","Deutschland leidet unter hohen Energiekosten und Bürokratie.","Deindustrialisierung gefährdet den Mittelstand.","Fachkräftemangel bremst die gesamte EU.","Der Euro benötigt eine tiefere politische Union.","Technologie-Innovationen finden oft außerhalb Europas statt."],
    ["Akzeptiere die Realität sofort, um reagieren zu können.","Diversifiziere über Rechtsräume und Währungen.","Halte Sachwerte als Schutz gegen Inflation.","Anpassungsfähigkeit ist Ihr wertvollstes Kapital.","Beobachte die 18 Faktoren laufend.","Bleibe liquide, wenn andere in Panik geraten."]
];

const names = ["Zyklus", "Faktoren", "Geld", "Konflikt", "USA", "China", "Europa", "Strategie"];
const topics = names.map((name, index) => {
    return { name: name, cards: Array.from({length: 18}, (_, i) => ({
        t: `${name}: Lektion ${i+1}`,
        c: (dataSets[index] && dataSets[index][i]) || `Analytische Vertiefung zum Sektor ${name} basierend auf den Prinzipien von Ray Dalio.`
    }))};
});

let currentTopic = 0, currentCard = 0;

function openTopic(id) { 
    currentTopic = id; currentCard = 0; 
    document.getElementById('card-overlay').style.display = 'flex'; 
    updateCard(); 
    cardAction();
}

function updateCard() {
    const data = topics[currentTopic].cards[currentCard];
    document.getElementById('overlay-title').innerText = data.t;
    document.getElementById('overlay-content').innerText = data.c;
    document.getElementById('card-counter').innerText = `${currentCard + 1} / 18`;
}

function cardAction() {
    window.speechSynthesis.cancel();
    const text = document.getElementById('overlay-content').innerText;
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'de-DE';
    window.speechSynthesis.speak(msg);
}

function nextCardAndRead() { 
    if (currentCard < 17) { 
        currentCard++; 
        updateCard(); 
        cardAction();
    } else { 
        closeOverlay(); 
    } 
}

function nextCard() { if (currentCard < 17) { currentCard++; updateCard(); } else { closeOverlay(); } }
function prevCard() { if (currentCard > 0) { currentCard--; updateCard(); cardAction(); } }
function closeOverlay() { document.getElementById('card-overlay').style.display = 'none'; window.speechSynthesis.cancel(); }

</script>
</body>
</html>
