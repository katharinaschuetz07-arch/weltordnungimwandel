<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Weltordnung im Wandel v2.3.10</title>

<style>
:root{
 --bg:#0a0f1a;
 --card-bg:#141c2d;
 --accent:#e6c65c;
 --accent-strong:#f2d777;
 --text:#f5f5f0;
 --radius:24px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 display:flex;
 flex-direction:column;
 min-height:100vh;
}

/* HEADER */

.header-fixed{
 position:sticky;
 top:0;
 text-align:center;
 padding:14px 0 8px 0;
 background:rgba(10,15,26,0.95);
 border-bottom:1px solid rgba(255,255,255,0.05);
}

.main-title{
 margin:0;
 font-size:22px;
 font-weight:800;
 letter-spacing:2px;
 color:var(--accent-strong);
 text-transform:uppercase;
}

.version-tag{
 font-size:10px;
 opacity:0.5;
 margin-top:4px;
}

/* LAYOUT */

.content-wrapper{
 max-width:390px;
 margin:0 auto;
 padding:10px;
 display:flex;
 flex-direction:column;
 align-items:center;
}

/* TOP GRID */

.button-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 width:100%;
 margin-bottom:10px;
}

.menu-btn{
 background:var(--card-bg);
 border:1px solid rgba(255,255,255,0.08);
 color:var(--accent);
 padding:10px 5px;
 border-radius:28px;
 font-size:12px;
 font-weight:bold;
 text-transform:uppercase;
 cursor:pointer;
}

/* CARD */

.info-card{
 width:100%;
 min-height:200px;
 background:var(--card-bg);
 border:1px solid var(--accent);
 border-radius:var(--radius);
 padding:16px 14px 30px 14px;
 margin-bottom:12px;
 text-align:center;
 position:relative;
 display:flex;
 flex-direction:column;
 justify-content:center;
 cursor:pointer;
}

.rubrik-label{
 position:absolute;
 top:10px;
 left:14px;
 font-size:10px;
 color:var(--accent);
 font-weight:bold;
}

.card-counter{
 position:absolute;
 top:10px;
 right:14px;
 font-size:10px;
 color:var(--accent);
}

.card-title{
 font-size:16px;
 font-weight:700;
 color:var(--accent-strong);
 margin-bottom:10px;
}

.card-text{
 font-size:14px;
 line-height:1.6;
}

.hint{
 position:absolute;
 bottom:8px;
 left:0;
 right:0;
 font-size:9px;
 opacity:0.5;
 color:var(--accent);
}

/* START & AUTHOR */

.special-buttons{
 width:100%;
 display:flex;
 flex-direction:column;
 gap:8px;
 margin-bottom:12px;
}

.special-buttons .menu-btn{
 width:100%;
 padding:12px 0;
 font-size:13px;
}

/* NAVIGATION */

.nav-controls{
 display:flex;
 gap:8px;
 width:100%;
 margin-bottom:10px;
}

.nav-btn{
 flex:1;
 padding:10px 0;
 background:var(--card-bg);
 border:1px solid var(--accent);
 color:var(--accent);
 border-radius:25px;
 font-size:12px;
 font-weight:bold;
 text-transform:uppercase;
 cursor:pointer;
}

/* VIDEO */

.yt-button{
 width:100%;
 padding:10px 0;
 background:#cc0000;
 border-radius:25px;
 text-align:center;
 color:white;
 text-decoration:none;
 font-size:12px;
 margin-bottom:8px;
}

/* FOOTER */

footer{
 text-align:center;
 font-size:10px;
 opacity:0.6;
 padding:10px;
}

.footer-brand{
 display:block;
 color:var(--accent);
 font-weight:bold;
 margin-bottom:4px;
}
</style>
</head>

<body>

<div class="header-fixed">
<p class="main-title">Weltordnung im Wandel</p>
<p class="version-tag">VERSION 2.3.10</p>
</div>

<div class="content-wrapper">

<div class="button-grid">
<button class="menu-btn" onclick="openTopic(0)">Zyklus</button>
<button class="menu-btn" onclick="openTopic(1)">Faktoren</button>
<button class="menu-btn" onclick="openTopic(2)">Geld</button>
<button class="menu-btn" onclick="openTopic(3)">Konflikt</button>
<button class="menu-btn" onclick="openTopic(4)">USA</button>
<button class="menu-btn" onclick="openTopic(5)">China</button>
<button class="menu-btn" onclick="openTopic(6)">Europa</button>
<button class="menu-btn" onclick="openTopic(7)">Strategie</button>
</div>

<div class="info-card" onclick="nextCardAndSpeak()">
<div class="rubrik-label" id="rubrik-label"></div>
<div class="card-counter" id="card-counter"></div>
<div class="card-title" id="card-title"></div>
<div class="card-text" id="overlay-content"></div>
<div class="hint">Tippen für nächste Karte</div>
</div>

<div class="special-buttons">
<button class="menu-btn" onclick="openStartCards()">Start</button>
<button class="menu-btn" onclick="openAuthorCard()">Ray Dalio</button>
</div>

<div class="nav-controls">
<button class="nav-btn" onclick="prevCard()">Zurück</button>
<button class="nav-btn" onclick="speakCurrentCard()">Vorlesen</button>
<button class="nav-btn" onclick="nextCardAndSpeak()">Weiter</button>
</div>

<a href="#" class="yt-button">🎬 VIDEO ANALYSE STARTEN</a>

</div>

<footer>
<span class="footer-brand">Ray Dalio Masterclass</span>
© 2025 Lern-App
</footer>

<script>
const topics=[
{name:"Zyklus",cards:[
["Zyklus – Grundlagen","Der Große Zyklus beschreibt Aufstieg und Fall von Imperien."],
["Zyklus – Beginn","Neue Ordnungen entstehen nach großen Konflikten."],
["Zyklus – Wachstum","Bildung und Innovation treiben Expansion."],
["Zyklus – Dominanz","Reservewährung bedeutet Macht."],
["Zyklus – Wendepunkt","Hohe Schulden leiten Abstieg ein."],
["Zyklus – Ende","Interne Konflikte schwächen Imperien."]
]},
];

const startCards=[
["Start","Willkommen zur Lern-App Weltordnung im Wandel."],
["Navigation","Nutze die Rubriken zur Steuerung."],
["Audio","Klick auf Karte oder Weiter für Vorlesen."],
["Analyse","Lerne globale Zyklen zu verstehen."]
];

let currentCard=0;
let specialCards=startCards;

function updateCard(){
let card=specialCards[currentCard];
document.getElementById("card-title").innerText=card[0];
document.getElementById("overlay-content").innerText=card[1];
document.getElementById("card-counter").innerText=(currentCard+1)+"/"+specialCards.length;
document.getElementById("rubrik-label").innerText="INFO";
}

function speakCurrentCard(){
window.speechSynthesis.cancel();
let msg=new SpeechSynthesisUtterance(document.getElementById("overlay-content").innerText);
msg.lang="de-DE";
window.speechSynthesis.speak(msg);
}

function nextCardAndSpeak(){
currentCard=(currentCard+1)%specialCards.length;
updateCard();
speakCurrentCard();
}

function prevCard(){
currentCard=(currentCard-1+specialCards.length)%specialCards.length;
updateCard();
speakCurrentCard();
}

function openStartCards(){
specialCards=startCards;
currentCard=0;
updateCard();
speakCurrentCard();
}

window.onload=function(){
updateCard();
speakCurrentCard();
}
</script>

</body>
</html>
